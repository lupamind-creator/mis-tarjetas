name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -o mis-tarjetas.zip -x '.github/*'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Crear proyecto Android
        run: |
          npx cap add android
          cp -r android-res/* android/app/src/main/res/
          npx cap sync android

      - name: Usar siempre la misma firma
        run: |
          mkdir -p ~/.android
          cp android-keystore/debug.keystore ~/.android/debug.keystore

      - name: Compilar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MisTarjetas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MisTarjetas
          path: MisTarjetas.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Mis Tarjetas v1.${{ github.run_number }}
          make_latest: true
          body: Descarga MisTarjetas.apk en tu celular Android e instálalo.
          files: MisTarjetas.apk
